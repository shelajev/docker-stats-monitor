name: Build Docker image

on:
  workflow_dispatch:

jobs:
  docker_build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@01aecccf739ca6ff86c0539fbc67a7a5007bbc81 # v2.1.0
    - name: Build Docker image
      uses: docker/build-push-action@92e71463491f2d026a477188b8ad3a0fdd9d672c # v1.1.0
      with:
        repository: vasilvasilev97/docker-stats-monitor
        push: false
