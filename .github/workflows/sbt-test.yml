name: Run tests

on:
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@01aecccf739ca6ff86c0539fbc67a7a5007bbc81 # v2.1.0
    - name: Setup Docker
      uses: docker-practice/actions-setup-docker@fa5ac33493c5c24007ef403aaa8ce3fb49699e2a # 0.0.1
    - name: Setup JDK 1.8
      uses: actions/setup-java@b74d5a6a962763ad3655696a314a4b34df4896c2 # v1.3.0
      with:
        java-version: 1.8
    - name: Setup Node.js environment
      uses: actions/setup-node@44c9c187283081e4e88b54b0efad9e9d468165a4 # v1.4.2
      with:
        node-version: 12.16.3
    - name: Run tests
      run: sbt test
